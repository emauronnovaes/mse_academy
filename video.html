<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Vídeo · MSE Academy</title>
<!-- Endereço antigo do link de cada aula. Hoje só redireciona para
     index.html?aula=N, que abre a aula no player da Academy (com perguntas
     e contando como assistida). Fica para os links já enviados continuarem
     funcionando. -->
<style>
  :root{ --bg:#000; --txt:#F2F2F2; --sub:#A6ACB5; --red:#C4212C; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:var(--bg); color:var(--txt);
    font-family:"Segoe UI", Roboto, Arial, Helvetica, sans-serif; }
  body{ display:flex; flex-direction:column; min-height:100vh; }
  .topo{ display:flex; align-items:center; gap:12px; padding:10px 16px; }
  .topo h1{ font-size:15px; font-weight:600; line-height:1.3; flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topo a{ color:var(--sub); font-size:13px; text-decoration:none; white-space:nowrap; }
  .topo a:hover{ color:var(--txt); }
  .palco{ flex:1; display:flex; align-items:center; justify-content:center; padding:0 0 12px; }
  .moldura{ width:100%; max-width:calc((100vh - 90px) * 16 / 9); aspect-ratio:16/9; background:#000; }
  .moldura iframe, .moldura video{ width:100%; height:100%; border:0; display:block; background:#000; }
  .aviso{ max-width:460px; margin:0 16px; text-align:center; font-size:15px; line-height:1.5; color:var(--sub); }
  .aviso strong{ display:block; color:var(--txt); font-size:17px; margin-bottom:8px; }
  .aviso a{ display:inline-block; margin-top:16px; padding:10px 18px; border-radius:8px;
    background:var(--red); color:#fff; text-decoration:none; font-weight:600; }
  .rodape{ padding:0 16px 14px; text-align:center; font-size:12.5px; color:var(--sub); }
  .rodape a{ color:var(--txt); }
  @media (max-height:500px) and (orientation:landscape){
    .topo, .rodape{ display:none; }
    .palco{ padding:0; }
    .moldura{ max-width:calc(100vh * 16 / 9); }
  }
</style>
</head>
<body>
  <div class="topo">
    <h1 id="titulo">Abrindo a aula...</h1>
    <a href="index.html">Ir para a Academy</a>
  </div>
  <div class="palco" id="palco"><div class="aviso">Abrindo a aula na MSE Academy...</div></div>
  <div class="rodape" id="rodape" hidden>
    Abrindo a aula na <a href="index.html">MSE Academy</a>...
  </div>

<script>
(function(){
  // Os links antigos (video.html?id=N, inclusive em PDFs já baixados) passam a
  // abrir a Academy direto na aula: lá aparecem as perguntas e o que a pessoa
  // assiste conta como assistido (ver abrirAulaDoLink no script.js).
  const id = parseInt(new URLSearchParams(location.search).get('id'), 10);
  if(id > 0){
    location.replace('index.html?aula=' + id);
    return;
  }
  document.getElementById('titulo').textContent = 'MSE Academy';
  document.getElementById('palco').innerHTML = '<div class="aviso"><strong>Link inválido</strong>Este link de vídeo está incompleto.<br><a href="index.html">Abrir a MSE Academy</a></div>';
})();
</script>
</body>
</html>
